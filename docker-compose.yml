# The full stack, with every container's environment written out in full.
#
# Nothing is shared through YAML anchors on purpose: each service below lists
# exactly what it needs, so one block maps onto one pod spec without having to
# resolve a merge key first.
#
#     Build:      docker compose build
#     Migrate:    docker compose run --rm migrate
#     Run:        docker compose up app queues scheduled
#     Sweep now:  docker compose run --rm collect-now
#     Stop:       docker compose down          (-v also wipes the volumes)
#
# ---------------------------------------------------------------------------
# The five with no default
# ---------------------------------------------------------------------------
# `configure` throws when any of these is missing, and it runs for every command
# — serve, the workers, the scheduler, the migrator. A gap stops the process at
# boot rather than producing a half-configured one:
#
#     TAPIS_BASE_URL       host and tenant must name the SAME tenant
#     TAPIS_TENANT         "
#     TAPIS_TOKEN          short-lived; unexplained vault errors usually mean expiry
#     TAPIS_USER           scopes the vault path
#     ROOT_ADMIN_USERNAME  break-glass admin; a placeholder boots and matches nobody
#
# Everything else has a default in code. `.env.example` explains each one.
#
# ---------------------------------------------------------------------------
# Which processes exist, and why
# ---------------------------------------------------------------------------
#   app        serves the API and the dashboard. Runs no jobs.
#   queues     drains the `metrics` queue — the syncs that actually write data.
#   scheduled  the clock. Its jobs only enqueue onto `metrics`; it also sends
#              the credential-expiry warnings inline.
#
# All three are needed. Without `scheduled` nothing enqueues on a timer; without
# `queues` the work piles up in Valkey and no metric is ever written, silently.
# Scale `queues` when collection falls behind — never `scheduled`, which must
# stay at one replica or every due resource is dispatched twice.
#
# ---------------------------------------------------------------------------
# What a deployment changes
# ---------------------------------------------------------------------------
# The values below are the local ones. A real deployment differs here:
#
#   VAPOR_ENV=production   picks the database name and gates the ICICLE seed
#                          migration, which must not run against real data
#   DATABASE_TLS=require   the local Postgres has no certificate; a real one does
#   REDIS_PASSWORD=…       set it, and start Valkey with --requirepass to match
#   ports                  publish only the app, behind a TLS terminator; db and
#                          valkey should not be reachable from outside
#   restart                unless-stopped on the three long-lived services

volumes:
  db_data:
  valkey_data:

services:
  # ==========================================================================
  # API and dashboard. Serves HTTP; processes no jobs.
  # ==========================================================================
  app:
    image: insights:latest
    build:
      context: .
    command: ["serve"]
    ports:
      - '8080:8080'
    environment:
      # -- required, no default ---------------------------------------------
      TAPIS_BASE_URL: ${TAPIS_BASE_URL}
      TAPIS_TENANT: ${TAPIS_TENANT}
      TAPIS_TOKEN: ${TAPIS_TOKEN}
      TAPIS_USER: ${TAPIS_USER}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME}
      # -- runtime -----------------------------------------------------------
      # No --env flag on the command above: it outranks VAPOR_ENV, which would
      # pin this one process while its siblings followed the variable.
      VAPOR_ENV: ${VAPOR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-tapis}
      # -- postgres ----------------------------------------------------------
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: vapor_database
      DATABASE_USERNAME: vapor_username
      DATABASE_PASSWORD: vapor_password
      DATABASE_TLS: disable
      # -- valkey ------------------------------------------------------------
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # -- HTTP surface: this service only ------------------------------------
      # Nothing else here serves requests, so these have no effect elsewhere.
      # No --hostname/--port on the command above, for the same reason VAPOR_ENV
      # carries no --env: a flag outranks the variable. 0.0.0.0 accepts on every
      # interface, which is what makes the published port reachable; Vapor's own
      # default of 127.0.0.1 would answer only inside the container.
      SERVER_HOSTNAME: ${SERVER_HOSTNAME:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      WEBHOOK_RATE_LIMIT_PER_MINUTE: ${WEBHOOK_RATE_LIMIT_PER_MINUTE:-60}
      # Verifies the webhook tokens deployed services post their metrics with.
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:-insights-token-signing-key}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # /health is liveness: process up, nothing else checked, so a database blip
    # cannot kill a container that would have recovered. /ready also tests
    # Postgres and Valkey — that is a load balancer's probe, not this one.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==========================================================================
  # Queue worker. Runs the platform syncs. Scale this one freely.
  # ==========================================================================
  queues:
    image: insights:latest
    build:
      context: .
    command: ["queues", "--queue", "metrics"]
    environment:
      # -- required, no default ---------------------------------------------
      TAPIS_BASE_URL: ${TAPIS_BASE_URL}
      TAPIS_TENANT: ${TAPIS_TENANT}
      TAPIS_TOKEN: ${TAPIS_TOKEN}
      TAPIS_USER: ${TAPIS_USER}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME}
      # -- runtime -----------------------------------------------------------
      VAPOR_ENV: ${VAPOR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-tapis}
      # -- postgres ----------------------------------------------------------
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: vapor_database
      DATABASE_USERNAME: vapor_username
      DATABASE_PASSWORD: vapor_password
      DATABASE_TLS: disable
      # -- valkey ------------------------------------------------------------
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # -- alerting: the workers only -----------------------------------------
      # Jobs fail here, so this is where the notifier fires. Unset, failures go
      # to the log alone. The warnings hook takes the recoverable failures so
      # the primary channel carries only the credential ones.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL_WARNINGS: ${SLACK_WEBHOOK_URL_WARNINGS:-}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ==========================================================================
  # Scheduler. Exactly one replica, always — two dispatch everything twice.
  # ==========================================================================
  scheduled:
    image: insights:latest
    build:
      context: .
    command: ["queues", "--scheduled"]
    deploy:
      replicas: 1
    environment:
      # -- required, no default ---------------------------------------------
      TAPIS_BASE_URL: ${TAPIS_BASE_URL}
      TAPIS_TENANT: ${TAPIS_TENANT}
      TAPIS_TOKEN: ${TAPIS_TOKEN}
      TAPIS_USER: ${TAPIS_USER}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME}
      # -- runtime -----------------------------------------------------------
      VAPOR_ENV: ${VAPOR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-tapis}
      # -- postgres ----------------------------------------------------------
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: vapor_database
      DATABASE_USERNAME: vapor_username
      DATABASE_PASSWORD: vapor_password
      DATABASE_TLS: disable
      # -- valkey ------------------------------------------------------------
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # -- alerting ------------------------------------------------------------
      # Also sends the daily credential-expiry warnings, which run inline here
      # rather than being enqueued.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL_WARNINGS: ${SLACK_WEBHOOK_URL_WARNINGS:-}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ==========================================================================
  # One-shot commands — a Job or CronJob in a cluster, not a running pod.
  # replicas: 0 keeps them out of `up`; reach them with `docker compose run`.
  # ==========================================================================

  # Run once before the first `up`, and after any deploy carrying a migration.
  migrate:
    image: insights:latest
    build:
      context: .
    command: ["migrate", "--yes"]
    deploy:
      replicas: 0
    environment:
      TAPIS_BASE_URL: ${TAPIS_BASE_URL}
      TAPIS_TENANT: ${TAPIS_TENANT}
      TAPIS_TOKEN: ${TAPIS_TOKEN}
      TAPIS_USER: ${TAPIS_USER}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME}
      VAPOR_ENV: ${VAPOR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-tapis}
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: vapor_database
      DATABASE_USERNAME: vapor_username
      DATABASE_PASSWORD: vapor_password
      DATABASE_TLS: disable
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  revert:
    image: insights:latest
    build:
      context: .
    command: ["migrate", "--revert", "--yes"]
    deploy:
      replicas: 0
    environment:
      TAPIS_BASE_URL: ${TAPIS_BASE_URL}
      TAPIS_TENANT: ${TAPIS_TENANT}
      TAPIS_TOKEN: ${TAPIS_TOKEN}
      TAPIS_USER: ${TAPIS_USER}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME}
      VAPOR_ENV: ${VAPOR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-tapis}
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: vapor_database
      DATABASE_USERNAME: vapor_username
      DATABASE_PASSWORD: vapor_password
      DATABASE_TLS: disable
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  # The scheduled sweeps, on demand. Each only enqueues onto `metrics`, so
  # `queues` has to be up or nothing actually collects.
  collect-now:
    image: insights:latest
    build:
      context: .
    command: ["collect-resources"]
    deploy:
      replicas: 0
    environment:
      TAPIS_BASE_URL: ${TAPIS_BASE_URL}
      TAPIS_TENANT: ${TAPIS_TENANT}
      TAPIS_TOKEN: ${TAPIS_TOKEN}
      TAPIS_USER: ${TAPIS_USER}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME}
      VAPOR_ENV: ${VAPOR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-tapis}
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: vapor_database
      DATABASE_USERNAME: vapor_username
      DATABASE_PASSWORD: vapor_password
      DATABASE_TLS: disable
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Ignores the schedule and dispatches every active resource. Dispatched
  # resources still book their next collection, so this shifts the cadence
  # forward rather than replaying it.
  collect-all-now:
    image: insights:latest
    build:
      context: .
    command: ["collect-resources", "--force"]
    deploy:
      replicas: 0
    environment:
      TAPIS_BASE_URL: ${TAPIS_BASE_URL}
      TAPIS_TENANT: ${TAPIS_TENANT}
      TAPIS_TOKEN: ${TAPIS_TOKEN}
      TAPIS_USER: ${TAPIS_USER}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME}
      VAPOR_ENV: ${VAPOR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-tapis}
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: vapor_database
      DATABASE_USERNAME: vapor_username
      DATABASE_PASSWORD: vapor_password
      DATABASE_TLS: disable
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  collect-accounts-now:
    image: insights:latest
    build:
      context: .
    command: ["collect-accounts"]
    deploy:
      replicas: 0
    environment:
      TAPIS_BASE_URL: ${TAPIS_BASE_URL}
      TAPIS_TENANT: ${TAPIS_TENANT}
      TAPIS_TOKEN: ${TAPIS_TOKEN}
      TAPIS_USER: ${TAPIS_USER}
      ROOT_ADMIN_USERNAME: ${ROOT_ADMIN_USERNAME}
      VAPOR_ENV: ${VAPOR_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SECRET_PROVIDER: ${SECRET_PROVIDER:-tapis}
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: vapor_database
      DATABASE_USERNAME: vapor_username
      DATABASE_PASSWORD: vapor_password
      DATABASE_TLS: disable
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ==========================================================================
  # Backing services
  # ==========================================================================

  # Job storage. Append-only so a restart does not drop what the scheduler
  # already enqueued. A deployment adds --requirepass and sets REDIS_PASSWORD
  # on every service above to match.
  valkey:
    image: valkey/valkey:9-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:18-alpine
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: vapor_username
      POSTGRES_PASSWORD: vapor_password
      POSTGRES_DB: vapor_database
    # Named user and database, not a bare pg_isready: the server accepts
    # connections briefly while still running its init scripts, and a migrator
    # that wins that race fails against a database it can see but cannot use.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
