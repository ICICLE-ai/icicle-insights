# Weekly update pull requests for the server's Swift packages, the CI actions and the Dockerfile's
# base images, grouped so each ecosystem opens one pull request a week rather than one per package.
#
# Update dashboard dependencies with `bun outdated` and `bun update` in web/ and commit
# package.json together with bun.lock. Frozen installs in CI and Docker enforce the lockfile.

version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      swift:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      images:
        patterns: ["*"]
